<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page3</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        } body {
      width: 100%;
      min-height: 100vh;
      background-color: #b8d4e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
 
    .container {
      background: #ffffff;
      border-radius: 28px;
      width: 390px;
      height: 260px;
      box-shadow: 6px 10px 0px 0px rgba(140, 170, 200, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
 
    .container button{
      width: 215px;
      height: 46px;
      background-color: #3d7ab5;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.1px;
    }
    .container button~button{
      background-color: #5297C2;
    }
 
    .container button:hover {
      background-color: #2f6a9e;
    }
    </style>
</head>
<body>
    <div class="container">
        <button>Rejoindre un groupe</button>
        <button>Créer un groupe</button>
       
    </div>
</body>
</html>
