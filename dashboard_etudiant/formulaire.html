<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulaire de Projet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="formulaire.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar">
        <img src="https://i.pravatar.cc/40" alt="avatar"/>
      </div>
      <div class="profile-info">
        <div class="name">Yassine Ghomriche</div>
        <div class="group">Groupe C</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="page10.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Tâche à soumettre
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Soutenance
      </a>
    </nav>

    <div class="logout">
      <button class="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="code-label">Code du groupe : ABC123</div>
        <h1>Formulaire de Projet</h1>
      </div>
    </div>

    <!-- Form Card -->
    <div class="form-card">

      <!-- Nom du projet -->
      <div class="field">
        <label for="nom_projet">Nom du projet</label>
        <input type="text" id="nom_projet" name="nom_projet" placeholder="Entrez le nom de votre projet..." />
      </div>

      <!-- Description -->
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Décrivez brièvement votre projet..."></textarea>
      </div>

      <!-- Upload rapport -->
      <div class="field">
        <label>Rapport (PDF)</label>
        <div class="upload-zone" id="upload-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div class="upload-text">Glissez votre fichier ici ou</div>
          <label for="rapport" class="upload-btn">Choisir un fichier</label>
          <input type="file" id="rapport" name="rapport" accept=".pdf" hidden />
          <div class="upload-hint">PDF uniquement</div>
          <div class="file-name" id="file-name"></div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <a href="page10.html" class="btn-cancel">Annuler</a>
        <button type="submit" class="btn-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><polyline points="20 6 9 17 4 12"/></svg>
          Soumettre
        </button>
      </div>

    </div>

  </main>

  <script>
    // Show file name after selection
    const input = document.getElementById('rapport');
    const fileName = document.getElementById('file-name');
    const zone = document.getElementById('upload-zone');

    input.addEventListener('change', function () {
      if (this.files && this.files[0]) {
        fileName.textContent = this.files[0].name;
        zone.classList.add('has-file');
      }
    });

    // Drag and drop support
    zone.addEventListener('dragover', function(e) {
      e.preventDefault();
      zone.classList.add('drag-over');
    });

    zone.addEventListener('dragleave', function() {
      zone.classList.remove('drag-over');
    });

    zone.addEventListener('drop', function(e) {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') {
        input.files = e.dataTransfer.files;
        fileName.textContent = file.name;
        zone.classList.add('has-file');
      }
    });
  </script>

</body>
</html>
