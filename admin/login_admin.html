<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — PFS</title>
  <link rel="stylesheet" href="login_admin.css">
</head>
<body>

  <div class="page">

    <!-- ===== PANNEAU GAUCHE ===== -->
    <div class="gauche">
      <div class="logo">PFS</div>
      <h1>Espace Administrateur</h1>
      <p>Accès réservé aux administrateurs de la plateforme.</p>
      <ul>
        <li>Gestion des groupes</li>
        <li>Suivi des formulaires soumis</li>
        <li>Assignation des encadrants</li>
      </ul>
    </div>

    <!-- ===== PANNEAU DROIT ===== -->
    <div class="droite">

      <h2>Connexion Admin</h2>
      <p class="sous-titre">Entrez vos identifiants administrateur</p>

      <form method="post" action="login_admin.php">

        <div class="champ">
          <label for="login">Login</label>
          <input type="text" id="login" name="login"
                 placeholder="Votre login" required>
        </div>

        <div class="champ">
          <label for="mot_de_passe">Mot de passe</label>
          <input type="password" id="mot_de_passe" name="mot_de_passe"
                 placeholder="Votre mot de passe" required>
        </div>

        <button type="submit">Se connecter</button>

      </form>

    </div>

  </div>

</body>
</html>
