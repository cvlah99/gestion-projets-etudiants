    <main class="main_tache">

        <section class="header_tache">
            <p class="welcome_text">
                BIENVENUE DANS L’ESPACE ENSEIGNANT. VOICI LA LISTE DES TÂCHES ET LEUR AVANCEMENT.
            </p>

            <h1>Ajouter une tâche</h1>

            <p class="subtitle">
                Créez une nouvelle tâche qui sera envoyée à tous les groupes.
            </p>
        </section>

        <section class="form_card">

            <form action="ajouter_tache.php" method="POST" class="form_ajouter_tache">

                <div class="form_group">
                    <label for="titre_tache">Titre de la tâche</label>
                    <input 
                        type="text" 
                        id="titre_tache" 
                        name="titre_tache" 
                        class="input_field" 
                        placeholder="Entrez le titre de la tâche"
                        required
                    >
                </div>

                <div class="form_group">
                    <label for="description_tache">Description</label>
                    <textarea 
                        id="description_tache" 
                        name="description_tache" 
                        class="textarea_field" 
                        placeholder="Décrivez la tâche, les consignes et les livrables attendus..."
                        required
                    ></textarea>
                </div>

                <div class="form_group">
                    <label for="date_limite">Date limite</label>
                    <input 
                        type="date" 
                        id="date_limite" 
                        name="date_limite" 
                        class="input_field"
                        required
                    >
                </div>

                <div class="form_group">
                    <label for="date_fin">Date de fin</label>
                    <input 
                        type="date" 
                        id="date_fin" 
                        name="date_fin" 
                        class="input_field"
                        required
                    >
                </div>

                <div class="form_actions">
                    <a href="taches_enseignant.html" class="btn_cancel">Annuler</a>

                    <button type="submit" class="btn_submit" name="btn_ajouter_tache">
                        <i class="fa-regular fa-floppy-disk"></i>
                        Ajouter la tâche
                    </button>
                </div>

            </form>

        </section>

    </main>
