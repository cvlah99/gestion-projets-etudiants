<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>page9</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #b8d4e8;
    }

    .container {
      background: #f3f3f3;
      padding: 30px;
      border-radius: 30px;
      width: 400px;
      text-align: center;
      box-shadow: 6px 10px 0 rgba(140, 170, 200, 0.6);
    }

    .container h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #000;
    }

    .card {
      background: #e6e6e6;
      border-radius: 20px;
      padding: 25px;
    }

    .label {
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0 15px;
      color: #000;
    }

    .code-box {
      display: inline-block;
      border: 1px solid #999;
      padding: 8px 20px;
      font-size: 20px;
      background: #fff;
      margin-top: 5px;
    }

    .btn {
      margin-top: 20px;
      background: #4a85b5;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #3a7db0;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Groupe créé avec succès</h1>

    <div class="card">
      <div class="label">Nom du groupe :</div>
      <div class="value">Nom_Groupe</div>

      <div class="label">Code du groupe :</div>
      <div class="code-box">ABCD123</div>

      <br>
      <button class="btn">Aller au dashboard</button>
    </div>
  </div>

</body>
</html>
