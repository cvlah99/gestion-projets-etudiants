<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page5</title>
 <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
     width: 100%; 
     min-height: 100vh;
      background-color: #b8d4e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
 
    .container{
      background: #ffffff;
      border-radius: 28px;
      width: 390px;
      height: 270px;
      box-shadow: 6px 10px 0px 0px rgba(140, 170, 200, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 36px;
      gap: 0;
    }
 
    .container h1 {
      font-size: 1.3rem;
      font-weight: 500;
      color: #1a1a2e;
      margin-bottom: 22px;
      letter-spacing: -0.2px;
    }
 
    .input-code {
      width: 100%;
      margin-bottom: 6px;
    }
 
    .input-code input {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border: 1.5px solid #d0dce8;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: 'DM Sans', sans-serif;
      color: #374151;
      background: #fff;
      outline: none;
    }
 
    .input-code input::placeholder {
      color: #9ca3af;
    }
 
    .input-code input:focus {
      border-color: #4a90c4;
      box-shadow: 0 0 0 3px rgba(74, 144, 196, 0.15);
    }
 
    .error {
      width: 100%;
      font-size: 0.78rem;
      color: #c0392b;
      margin-bottom: 14px;
      padding-left: 2px;
    }
 
    .btn {
      width: 100%;
      height: 46px;
      background-color: #4a85b5;
      color: #fff;
      font-size: 0.97rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background-color 0.2s;
    }
 
    .btn:hover {
      background-color: #3a7db0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rejoindre un groupe</h1>
    <div class="input-code">
      <input type="text" placeholder="Code du groupe" />
    </div>
    <p class="error">*code invalid</p>
    <button class="btn">Rejoindre</button>
  </div>
</body>
</html>
